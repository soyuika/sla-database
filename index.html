<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Exercise Database</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {a
    --bg: #0c0e13;
    --card: #15181f;
    --card-2: #1b1f28;
    --ink: #e6e8ec;
    --muted: #8a92a3;
    --line: #262b35;
    --accent: #5b8def;
    --accent-soft: #1a2540;
    --ok: #22c55e;
    --warn: #f97316;
    --r: 12px;
  }
  body {
    margin: 0; padding: 28px 16px 64px; background: var(--bg); color: var(--ink);
    font: 16.5px/1.6 "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 26px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 650; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
    cursor: pointer; transition: .12s;
  }
  .btn:hover { background: #232833; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: #232833; color: var(--ink); }
  .btn.danger { color: #f87171; }
  .btn.danger:hover { background: #3a1a1a; }
  label { display: block; font-size: 13px; font-weight: 550; color: #b0b8c6; margin-top: 12px; }
  input, textarea, select {
    width: 100%; margin-top: 5px; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 9px; font: inherit; font-size: 15px; background: var(--card-2); color: var(--ink);
  }
  input::placeholder, textarea::placeholder { color: #5a6270; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  textarea { resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }

  .section-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .section-nav button {
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
    cursor: pointer; transition: .12s;
  }
  .section-nav button:hover { background: #232833; }
  .section-nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #exerciseList { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { #exerciseList { grid-template-columns: 1fr; } }
  .exercise { border: 1px solid var(--line); border-radius: 11px; padding: 14px 16px; background: var(--card); transition: box-shadow 0.2s ease, transform 0.2s ease; cursor: pointer; }
  .exercise.open { box-shadow: 0 10px 28px rgba(0,0,0,0.55); transform: translateY(-2px); z-index: 10; position: relative; }

  .exercise-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .exercise-name { font-weight: 650; font-size: 17px; }

  /* Step List Inputs */
  .step-row { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .step-row input { margin-top: 0; flex: 1; }
  .step-row button { flex: 0 0 auto; padding: 8px 12px; border-color: #4a1f1f; color: #f87171; background: var(--card-2); cursor: pointer; border-radius: 9px; font: inherit; font-size: 13px; }
  .step-row button:hover { background: #3a1a1a; }
  .step-row button.indent-btn { padding: 8px 10px; color: var(--muted); border-color: var(--line); }
  .step-row button.indent-btn:hover { background: #232833; }
  .step-row button.indent-btn.active { background: var(--accent-soft); border-color: var(--accent); color: #7faaff; }

  /* Algorithm & Tips display in the card */
  .exercise-steps { margin: 0; padding-left: 20px; font-size: 14.5px; color: #b0b8c6; max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease; }
  .exercise-steps li { margin-bottom: 3px; }
  .exercise-steps ol { list-style-type: lower-alpha; padding-left: 18px; margin-top: 2px; }
  .exercise-steps ol li { margin-bottom: 2px; color: var(--muted); }
  .tips-box { margin: 0; padding: 0 12px; background: var(--card-2); border-left: 3px solid var(--accent); border-radius: 6px; font-size: 13.5px; color: #b0b8c6; white-space: pre-wrap; max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease; }
  .exercise-desc { margin-top: 0; color: #b0b8c6; font-size: 14.5px; max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease; }
  .exercise.open .exercise-desc { max-height: 200px; opacity: 1; margin-top: 7px; margin-bottom: 7px; }
  .exercise.open .exercise-steps { max-height: 1200px; opacity: 1; margin-top: 9px; }
  .exercise.open .tips-box { max-height: 200px; opacity: 1; padding: 9px 12px; margin-top: 10px; }

      /* Tags — section color lives here */
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; letter-spacing: .01em; }
  .tag.primary   { background: var(--tag-bg); color: var(--tag-fg); }
    .tag.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  /* Per-section tag palettes */
  .tag-vocabulary { --tag-bg: #1a2440; --tag-fg: #8ab4ff; --tag-border: #3a5a9d; }
  .tag-grammar    { --tag-bg: #231a40; --tag-fg: #b499ff; --tag-border: #5a3d9d; }
  .tag-listening  { --tag-bg: #0f2a2a; --tag-fg: #5dd4c0; --tag-border: #2d7a6a; }
  .tag-speaking   { --tag-bg: #2a1a10; --tag-fg: #ffa070; --tag-border: #8a4d2d; }
  .tag-reading    { --tag-bg: #0f2a1a; --tag-fg: #7bd695; --tag-border: #2d7a4a; }
  .tag-writing    { --tag-bg: #2a1420; --tag-fg: #ff8fb8; --tag-border: #8a3d5a; }
  .tag-accent     { --tag-bg: #2a2410; --tag-fg: #ffce6b; --tag-border: #8a6d2d; }
  .tag-culture    { --tag-bg: #1a1e28; --tag-fg: #a8b2c4; --tag-border: #4a5568; }
   /* Level checkboxes in form */
  .level-checkboxes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .level-check { margin-top: 0; cursor: pointer; }
  .level-check input { display: none; }
  .level-check span {
    display: inline-block;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--ink);
    font-size: 13px;
    font-weight: 550;
    transition: .12s;
  }
  .level-check:hover span { border-color: var(--accent); }
  .level-check input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

    /* Level badge on exercise card — neutral, subtle */
  .level-row { margin-top: 8px; }
  .level-badge {
    display: inline-block;
    padding: 3px 11px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 550;
    letter-spacing: .02em;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }
   .arrow-btn { padding: 6px 9px; font-size: 14px; line-height: 1; min-width: 30px; }
   /* Recommended duration chips */
  .durations-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin: 0; max-height: 0; overflow: hidden; opacity: 0;
    transition: all 0.3s ease;
  }
  .exercise.open .durations-row { max-height: 200px; opacity: 1; margin-top: 10px; }
  .duration-chip {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    background: var(--card-2); border: 1px solid var(--line);
    font-size: 12px;
  }
  .duration-chip .stage { color: var(--muted); font-weight: 500; }
  .duration-chip .val   { color: var(--ink); font-weight: 600; }
   /* Collapsible add/edit form */
  #formTitle {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #formTitle:hover { color: var(--ink); }
  #formToggleArrow { font-size: 14px; color: var(--muted); transition: transform 0.2s ease; }
  #formCard.collapsed #formToggleArrow { transform: rotate(-90deg); }
  #formCard.collapsed #exerciseForm { display: none; }
  #formCard.collapsed #formTitle { margin-bottom: 0; }
   /* ---------- Folder view (All tab) ---------- */
  .folder-tile {
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 16px 18px;
    background: var(--card);
    cursor: pointer;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
    min-width: 0;
  }
  .folder-tile:hover {
    box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    transform: translateY(-2px);
  }
  .folder-tile-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .folder-tile-name { font-size: 17px; font-weight: 650; }
  .folder-tile-count {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: var(--card-2);
    padding: 2px 9px;
    border-radius: 20px;
    border: 1px solid var(--line);
  }
  .folder-preview {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .folder-preview-item {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .folder-more {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    font-style: italic;
    opacity: 0.8;
  }
   /* Linked exercises — form chips */
  .link-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    background: var(--card-2); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink);
  }
  .link-chip button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 0; font: inherit; line-height: 1; font-size: 12px;
  }
  .link-chip button:hover { color: #f87171; }

  /* Linked exercises — search results */
  #f-link-results:empty { display: none; }
  #f-link-results {
    margin-top: 6px; border: 1px solid var(--line); border-radius: 9px;
    overflow: hidden; background: var(--card-2);
  }
  #f-link-results button {
    display: block; width: 100%; text-align: left; padding: 9px 12px;
    background: transparent; border: none; color: var(--ink); cursor: pointer;
    font: inherit; font-size: 14px; border-bottom: 1px solid var(--line);
  }
  #f-link-results button:last-child { border-bottom: none; }
  #f-link-results button:hover { background: #232833; }
  #f-link-results .no-results { padding: 9px 12px; color: var(--muted); font-size: 13px; }

    /* Linked exercises — display on card */
  .linked-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin: 0; max-height: 0; overflow: hidden; opacity: 0;
    transition: all 0.3s ease;
  }
  .exercise.open .linked-row { max-height: 200px; opacity: 1; margin-top: 10px; }
  .linked-chip {
    display: inline-block;
    padding: 3px 10px; border-radius: 20px;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-size: 11.5px; font-weight: 550; cursor: pointer;
    transition: .12s;
  }
  .linked-chip:hover { border-color: var(--accent); color: var(--accent); }

  .empty { color: var(--muted); font-size: 14.5px; padding: 8px 0; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #262b35; color: #e6e8ec; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; z-index: 100; opacity: 0; transition: opacity .25s; pointer-events: none;
    border: 1px solid #3a4252;
  }
  .toast.show { opacity: 1; }
  .auth-bar { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
   .site-footer {
    max-width: 960px;
    margin: 32px auto 0;
    padding: 20px 0 8px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
   /* ---------- Mobile tweaks ---------- */
  @media (max-width: 640px) {
    body {
      padding: 18px 12px calc(110px + env(safe-area-inset-bottom, 0px));
      overflow-x: hidden;
    }
    .wrap { gap: 14px; min-width: 0; }
    h1 { font-size: 21px; line-height: 1.25; }
    .card { padding: 14px 14px; min-width: 0; overflow: hidden; }
    #exerciseList { grid-template-columns: 1fr; min-width: 0; }
    .exercise { padding: 12px 14px; min-width: 0; overflow-wrap: anywhere; }
    .exercise-name { font-size: 15.5px; overflow-wrap: anywhere; }
    .exercise-desc, .exercise-steps { font-size: 13.5px; overflow-wrap: anywhere; word-break: break-word; }
    .exercise-top { flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 2px 8px; }
    .section-nav button { font-size: 12.5px; padding: 6px 11px; }
    .step-row input { font-size: 14px; padding: 8px 10px; min-width: 0; }
    .step-row button { padding: 8px 10px; font-size: 12px; }
    .tips-box { overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="row" style="justify-content: space-between; align-items: flex-start;">
    <div>
      <h1>Language Exercise Database</h1>
      <div style="color:var(--muted);font-size:13px;margin-top:4px;">A personal collection of exercises for language learning.</div>
    </div>
    <div class="auth-bar" id="authBar"></div>
  </div>

  <!-- SIGN IN (shown when not authenticated) -->
  <div class="card" id="signInCard">
    <h2>Sign in to manage exercises</h2>
    <div class="empty" style="margin-bottom:10px;">Students can browse without signing in. Sign in only if you want to add or edit exercises.</div>
    <div class="grid2">
      <div>
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn primary" id="signInBtn">Sign in</button>
      <button class="btn ghost" id="skipBtn">Browse as student</button>
    </div>
  </div>

  <!-- ADD / EDIT FORM (shown when authenticated) -->
  <div class="card hidden" id="formCard">
        <h2 id="formTitle">
      <span id="formTitleText">Add an exercise</span>
      <span id="formToggleArrow">▾</span>
    </h2>
    <form id="exerciseForm">
      <div class="grid2">
        <div>
          <label>Name of exercise</label>
          <input id="f-name" required placeholder="Shadowing with subtitles">
        </div>
        <div>
          <label>Primary section</label>
          <select id="f-primary" required>
            <option value="">Choose…</option>
            <option>Vocabulary</option>
            <option>Grammar</option>
            <option>Listening</option>
            <option>Speaking</option>
            <option>Reading</option>
            <option>Writing</option>
            <option>Accent</option>
            <option>Culture</option>
          </select>
        </div>
      </div>
      <label>Alternative names (comma-separated)</label>
      <input id="f-alt" placeholder="Shadowing, Parroting, Echoing">
      <label>Description</label>
      <textarea id="f-desc" rows="2" placeholder="What is this exercise and what does it train?"></textarea>
      <label>Secondary tags (comma-separated)</label>
      <input id="f-secondary" placeholder="Listening, Speaking">
           <label>Recommended levels (CEFR)</label>
      <div class="level-checkboxes">
                <label class="level-check"><input type="checkbox" class="f-level" value="ANY"><span>Any level</span></label>
       <label class="level-check"><input type="checkbox" class="f-level" value="A0"><span>A0</span></label>
        <label class="level-check"><input type="checkbox" class="f-level" value="A1"><span>A1</span></label>
        <label class="level-check"><input type="checkbox" class="f-level" value="A2"><span>A2</span></label>
        <label class="level-check"><input type="checkbox" class="f-level" value="B1"><span>B1</span></label>
        <label class="level-check"><input type="checkbox" class="f-level" value="B2"><span>B2</span></label>
        <label class="level-check"><input type="checkbox" class="f-level" value="C1"><span>C1</span></label>
        <label class="level-check"><input type="checkbox" class="f-level" value="C2"><span>C2</span></label>
      </div>
      <label>Linked exercises (recommended alongside this one)</label>
      <div id="linked-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;"></div>
      <input id="f-link-search" placeholder="Search exercises to link..." style="margin-top:6px;">
      <div id="f-link-results"></div>
      <label>Algorithm / Steps (optional)</label>
      <div id="steps-container" style="margin-top: 5px;"></div>
      <button type="button" class="btn" id="addStepBtn" style="margin-top: 8px; font-size: 12px; padding: 6px 12px; border-style: dashed;">+ Add Step</button>

      <label>Tips / General advice (optional)</label>
      <textarea id="f-tips" rows="2" placeholder="Useful tips or things to keep in mind."></textarea>
           <label>Recommended duration (per stage)</label>
      <div class="grid2">
        <div>
          <label style="margin-top:6px;font-weight:500;font-size:12px;color:var(--muted);">1 · Starting out (building a habit)</label>
          <input id="f-dur-starting" placeholder="e.g. 5 min/day">
        </div>
        <div>
          <label style="margin-top:6px;font-weight:500;font-size:12px;color:var(--muted);">2 · Slow progress</label>
          <input id="f-dur-slow" placeholder="e.g. 15 min/day">
        </div>
        <div>
          <label style="margin-top:6px;font-weight:500;font-size:12px;color:var(--muted);">3 · Fast progress</label>
          <input id="f-dur-fast" placeholder="e.g. 30 min/day">
        </div>
      </div>
      <div class="row" style="margin-top:14px;">
        <button type="submit" class="btn primary" id="submitBtn">Add exercise</button>
        <button type="button" class="btn hidden" id="cancelEdit">Cancel edit</button>
        <button type="button" class="btn ghost" id="signOutBtn">Sign out</button>
      </div>
    </form>
  </div>

  <!-- SECTION NAVIGATION -->
  <div class="card">
    <h2>Browse by section</h2>
    <div class="section-nav" id="sectionNav"></div>
  </div>

  <!-- EXERCISE LIST -->
  <div class="card">
    <h2 id="listTitle">All exercises</h2>
    <div id="exerciseList"></div>
  </div>

</div>

<footer class="site-footer">
  © <span id="footerYear"></span> soyuika · All rights reserved
</footer>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====================== REPLACE WITH YOUR CONFIG ====================== */
const firebaseConfig = {
  apiKey: "AIzaSyDYj-8rvoTWgqCvg-1uvhwJ4Bf-iRakpiM",
  authDomain: "sla-db.firebaseapp.com",
  projectId: "sla-db",
  storageBucket: "sla-db.firebasestorage.app",
  messagingSenderId: "1011500709503",
  appId: "1:1011500709503:web:0042f16fcf8b33a6df314a"
};
/* ===================================================================== */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const SECTIONS = ["Vocabulary","Grammar","Listening","Speaking","Reading","Writing","Accent","Culture"];
const COLLECTION = "exercises";

let allExercises = [];
let currentSection = null;
let editingId = null;
let currentUser = null;
 let isAdmin = false;
const ADMIN_EMAIL = "ma8gle@gmail.com"; 

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}
function uidFromDoc(d) { return d.id; }

/* ---------- auth ---------- */
document.getElementById("signInBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { toast("Sign in failed: " + e.message); }
});
document.getElementById("skipBtn").addEventListener("click", () => {
  document.getElementById("signInCard").classList.add("hidden");
});
document.getElementById("signOutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, user => {
  currentUser = user;
  isAdmin = !!(user && user.email === ADMIN_EMAIL);
  const bar = document.getElementById("authBar");

/* ---------- levels ---------- */
const LEVEL_ORDER = ["A0", "A1", "A2", "B1", "B2", "C1", "C2"];
 function sortByLevels(list) {
  return list.slice().sort((a, b) => {
    const aLevels = a.levels || [];
    const bLevels = b.levels || [];

    // Exercises without levels go last
    const aHas = aLevels.length > 0;
    const bHas = bLevels.length > 0;
    if (!aHas && !bHas) return compareOrder(a, b);
    if (!aHas) return 1;
    if (!bHas) return -1;

    // "Any level" always floats to the top, but its own order matters too
    const aAny = aLevels.includes("ANY");
    const bAny = bLevels.includes("ANY");
    if (aAny && !bAny) return -1;
    if (bAny && !aAny) return 1;
    if (aAny && bAny) return compareOrder(a, b);

    // Convert to numeric indices
    const aIdx = aLevels.map(l => LEVEL_ORDER.indexOf(l)).filter(i => i >= 0);
    const bIdx = bLevels.map(l => LEVEL_ORDER.indexOf(l)).filter(i => i >= 0);
    if (!aIdx.length && !bIdx.length) return compareOrder(a, b);
    if (!aIdx.length) return 1;
    if (!bIdx.length) return -1;

    const aMin = Math.min(...aIdx);
    const bMin = Math.min(...bIdx);
    if (aMin !== bMin) return aMin - bMin;

    const aMax = Math.max(...aIdx);
    const bMax = Math.max(...bIdx);
    if (aMax !== bMax) return aMax - bMax;

    return compareOrder(a, b);
  });
}

function compareOrder(a, b) {
  const aOrd = a.order != null ? a.order : 0;
  const bOrd = b.order != null ? b.order : 0;
  if (aOrd !== bOrd) return aOrd - bOrd;
  return (a.name || "").localeCompare(b.name || "");
}
 async function moveExercise(id, direction) {
  const section = currentSection;
  if (!section) return;

  const list = sortByLevels(allExercises.filter(e => e.primary === section));
  const idx = list.findIndex(e => e.id === id);
  if (idx < 0) return;

  const swapIdx = direction === "up" ? idx - 1 : idx + 1;
  if (swapIdx < 0 || swapIdx >= list.length) return;

  // Only allow reordering within the same level group
  const keyOf = (e) => {
    const lv = (e.levels || []).slice().sort((x, y) => LEVEL_ORDER.indexOf(x) - LEVEL_ORDER.indexOf(y));
    return lv.join(",");
  };
  if (keyOf(list[idx]) !== keyOf(list[swapIdx])) {
    toast("Can only reorder within the same level group.");
    return;
  }

  // Swap positions in the array
  [list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];

  // Reassign sequential order values (10, 20, 30...) across the section
  const updates = [];
  for (let i = 0; i < list.length; i++) {
    const desired = (i + 1) * 10;
    const current = list[i].order != null ? list[i].order : 0;
    if (current !== desired) {
      updates.push(updateDoc(doc(db, COLLECTION, list[i].id), { order: desired }));
      const local = allExercises.find(x => x.id === list[i].id);
      if (local) local.order = desired;
    }
  }
  if (!updates.length) return;

  try {
    await Promise.all(updates);
    renderList();
  } catch (err) {
    toast("Reorder failed: " + err.message);
    await loadExercises();
   document.getElementById("footerYear").textContent = new Date().getFullYear();
  }
}
function classifyLevels(levels) {
  if (!levels || !levels.length) return { text: "", cls: "" };
  if (levels.includes("ANY")) return { text: "Any level", cls: "any" };

  const sorted = levels.slice().sort((a, b) => LEVEL_ORDER.indexOf(a) - LEVEL_ORDER.indexOf(b));

  const bands = {
    beginner:     ["A0", "A1", "A2"],
    intermediate: ["B1", "B2"],
    advanced:     ["C1", "C2"]
  };

  // Exact match for a full band → friendly name
  for (const [name, band] of Object.entries(bands)) {
    if (sorted.length === band.length && sorted.every(l => band.includes(l))) {
      return { text: name.charAt(0).toUpperCase() + name.slice(1), cls: name };
    }
  }

  // Single level
  if (sorted.length === 1) {
    const lv = sorted[0];
    const bandEntry = Object.entries(bands).find(([, arr]) => arr.includes(lv));
    return { text: lv, cls: bandEntry ? bandEntry[0] : "mixed" };
  }

  // Check if the levels form a contiguous range
  const idxs = sorted.map(l => LEVEL_ORDER.indexOf(l));
  let contiguous = true;
  for (let i = 1; i < idxs.length; i++) {
    if (idxs[i] !== idxs[i - 1] + 1) { contiguous = false; break; }
  }

  if (contiguous) {
    const first = sorted[0];
    const last  = sorted[sorted.length - 1];
    if (last === "C2") return { text: first + "+", cls: "mixed" };
    return { text: first + "-" + last, cls: "mixed" };
  }

  // Non-contiguous → show the actual list
  return { text: sorted.join(", "), cls: "mixed" };
}
function renderLevelBadge(levels) {
  const { text, cls } = classifyLevels(levels);
  if (!text) return "";
  return `<div class="level-row"><span class="level-badge ${cls}">${esc(text)}</span></div>`;
}
/* ---------- level checkboxes: mutual exclusivity for "Any" ---------- */
(function initLevelExclusivity() {
  const boxes = document.querySelectorAll(".f-level");
  if (!boxes.length) return;
  boxes.forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.value === "ANY" && cb.checked) {
        // Any selected → deselect all specific levels
        document.querySelectorAll(".f-level").forEach(other => {
          if (other !== cb) other.checked = false;
        });
      } else if (cb.value !== "ANY" && cb.checked) {
        // Specific level selected → deselect Any
        const anyBox = document.querySelector('.f-level[value="ANY"]');
        if (anyBox) anyBox.checked = false;
      }
    });
  });
})();
 function renderDurations(d) {
  if (!d) return "";
  const chips = [];
  if (d.starting) chips.push(`<span class="duration-chip"><span class="stage">Starting</span><span class="val">${esc(d.starting)}</span></span>`);
  if (d.slow)     chips.push(`<span class="duration-chip"><span class="stage">Slow progress</span><span class="val">${esc(d.slow)}</span></span>`);
  if (d.fast)     chips.push(`<span class="duration-chip"><span class="stage">Fast progress</span><span class="val">${esc(d.fast)}</span></span>`);
  if (!chips.length) return "";
  return `<div class="durations-row">${chips.join("")}</div>`;

 /* ---------- linked exercises ---------- */

function renderLinked(ids) {
  if (!ids || !ids.length) return "";
  const chips = ids.map(id => {
    const linked = allExercises.find(x => x.id === id);
    if (!linked) return "";
    return `<span class="linked-chip" data-jump="${id}">↗ ${esc(linked.name)}</span>`;
  }).filter(Boolean).join("");

function jumpToExercise(id) {
  const linked = allExercises.find(x => x.id === id);
  if (!linked) { toast("That exercise no longer exists."); return; }

  // If it's not currently visible, switch to a section where it will be
  let target = document.querySelector(`.exercise[data-id="${id}"]`);
  if (!target) {
    currentSection = linked.primary;
    renderSectionNav();
    renderList();
    target = document.querySelector(`.exercise[data-id="${id}"]`);
  }
  if (!target) { toast("Couldn't locate that exercise."); return; }

  target.classList.add("open");
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  const original = target.style.boxShadow;
  target.style.boxShadow = "0 0 0 2px var(--accent)";
  setTimeout(() => { target.style.boxShadow = original; }, 1200);
}

 /* ---------- exercise list ---------- */
function renderList() {

  /* ---------- Regular exercise view (section selected) ---------- */

  title.textContent = `Exercises — ${currentSection}`;

  if (!list.length) {
    box.innerHTML = '<div class="empty">No exercises match this section.</div>';

  box.innerHTML = list.map(e => `

        <div>

          ${e.altNames ? `<div style="font-size:13px;color:var(--muted);margin-top:3px;">Also known as: ${esc(e.altNames)}</div>` : ""}
          <div class="tags">
            <span class="tag primary tag-${e.primary.toLowerCase()}">${esc(e.primary)}</span>
            ${(e.secondary || []).map(t => `<span class="tag secondary tag-${t.toLowerCase()}">${esc(t)}</span>`).join("")}
          </div>
          ${renderLevelBadge(e.levels)}
        </div>
               <div class="row" style="flex:0 0 auto; gap:4px;">
          ${isAdmin ? `
            <button class="btn ghost arrow-btn" data-move-up="${e.id}" title="Move up">↑</button>
            <button class="btn ghost arrow-btn" data-move-down="${e.id}" title="Move down">↓</button>
            <button class="btn ghost" data-edit="${e.id}">Edit</button>
            <button class="btn ghost danger" data-del="${e.id}">Delete</button>
          ` : ""}
        </div>
      </div>
            ${renderDurations(e.durations)}
      ${e.description ? `<div class="exercise-desc">${esc(e.description)}</div>` : ""}
      ${renderSteps(Array.isArray(e.algorithm) ? e.algorithm : (e.algorithm ? e.algorithm.split("\n") : []))}
      ${e.tips ? `<div class="tips-box"><strong>💡 Tips:</strong> ${esc(e.tips)}</div>` : ""}

  // wire edit/delete
  box.querySelectorAll("[data-edit]").forEach(b =>

  box.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", () => deleteExercise(b.dataset.del)));
   box.querySelectorAll("[data-move-up]").forEach(b =>
    b.addEventListener("click", (e) => { e.stopPropagation(); moveExercise(b.dataset.moveUp, "up"); }));
  box.querySelectorAll("[data-move-down]").forEach(b =>
    b.addEventListener("click", (e) => { e.stopPropagation(); moveExercise(b.dataset.moveDown, "down"); }));

  // expand/collapse on click
  box.querySelectorAll(".exercise").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.closest('button')) return;
      const jump = e.target.closest("[data-jump]");
      if (jump) {
        e.stopPropagation();
        jumpToExercise(jump.dataset.jump);
        return;
      }
      card.classList.toggle("open");
    });
  });
}

/* ---------- form: add / edit ---------- */
 function renderSteps(steps) {
  if (!steps || !steps.length) return "";
  let html = '<ol class="exercise-steps">';
  let i = 0;
  while (i < steps.length) {
    const step = steps[i];
    if (step.startsWith("- ")) {
      // Orphan sub-step — treat as regular
      html += `<li>${esc(step.replace(/^-\s*/, ""))}</li>`;
      i++;
      continue;
    }
    html += `<li>${esc(step)}`;
    let j = i + 1;
    const subs = [];
    while (j < steps.length && steps[j].startsWith("- ")) {
      subs.push(steps[j].replace(/^-\s*/, ""));
      j++;
    }
    if (subs.length) {
      html += "<ol>" + subs.map(s => `<li>${esc(s)}</li>`).join("") + "</ol>";
    }
    html += "</li>";
    i = j;
  }
  html += "</ol>";
  return html;
}
document.getElementById("exerciseForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!currentUser) { toast("Sign in first."); return; }

  const name = document.getElementById("f-name").value.trim();
  const primary = document.getElementById("f-primary").value;
  const description = document.getElementById("f-desc").value.trim();
  const altNames = document.getElementById("f-alt").value.trim();
  const secondary = document.getElementById("f-secondary").value
    .split(",").map(x => x.trim()).filter(Boolean);
      const algorithm = Array.from(document.querySelectorAll("#steps-container .step-row"))
    .map(row => {
      const text = row.querySelector("input").value.trim();
      if (!text) return null;
      const isSub = row.querySelector(".indent-btn").classList.contains("active");
      return isSub ? "- " + text : text;
    })
    .filter(Boolean);
  const tips = document.getElementById("f-tips").value.trim();
   const durations = {
    starting: document.getElementById("f-dur-starting").value.trim(),
    slow: document.getElementById("f-dur-slow").value.trim(),
    fast: document.getElementById("f-dur-fast").value.trim()
  };
  const levels = Array.from(document.querySelectorAll(".f-level:checked")).map(cb => cb.value);
   const linkedIdsFinal = linkedIds.slice();

  if (!name || !primary) { toast("Name and primary section are required."); return; }

          const payload = { name, primary, description, secondary, algorithm, altNames, tips, levels, linkedIds: linkedIdsFinal, durations };

  try {
    if (editingId) {
      await updateDoc(doc(db, COLLECTION, editingId), payload);
      toast("Exercise updated.");
    } else {
      await addDoc(collection(db, COLLECTION), payload);
      toast("Exercise added.");
    }
    resetForm();
    await loadExercises();
  } catch (err) {
    toast("Save failed: " + err.message);
  }
});

document.getElementById("cancelEdit").addEventListener("click", resetForm);

  editingId = null;
  document.getElementById("exerciseForm").reset();
  document.getElementById("steps-container").innerHTML = "";
  addStepField();
   linkedIds = [];
  renderLinkedChips();
  const searchEl = document.getElementById("f-link-search");

function startEdit(id) {
  const e = allExercises.find(x => x.id === id);
  if (!e) return;
 document.getElementById("formCard").classList.remove("collapsed");

  document.getElementById("f-desc").value = e.description || "";
  document.getElementById("f-secondary").value = (e.secondary || []).join(", ");
  document.getElementById("f-tips").value = e.tips || "";

   linkedIds = Array.isArray(e.linkedIds) ? e.linkedIds.slice() : [];

  else steps.forEach(step => addStepField(step));

  document.getElementById("submitBtn").textContent = "Save changes";
  document.getElementById("cancelEdit").classList.remove("hidden");

}
 function addStepField(value = "") {
  const container = document.getElementById("steps-container");
  const row = document.createElement("div");
  row.className = "step-row";
  const isSub = String(value).trim().startsWith("- ");
  const displayValue = isSub ? String(value).replace(/^\s*-\s*/, "") : value;
  row.innerHTML = `
    <button type="button" class="indent-btn ${isSub ? "active" : ""}" title="Toggle sub-step">↳</button>
    <input type="text" placeholder="Enter a step" value="${esc(displayValue)}">
    <button type="button" class="remove-step" title="Remove step">✕</button>`;
  row.querySelector(".indent-btn").addEventListener("click", (e) => {
    e.preventDefault();
    e.currentTarget.classList.toggle("active");
  });
  row.querySelector(".remove-step").addEventListener("click", (e) => {
    e.preventDefault();
    row.remove();
  });
  container.appendChild(row);
}

document.getElementById("addStepBtn").addEventListener("click", () => addStepField());
